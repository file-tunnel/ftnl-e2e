name: Desktop parity E2E

on:
  pull_request:
    paths:
      - "tests/desktop/**"
      - ".github/workflows/desktop-parity.yml"
  push:
    branches: [main]
    paths:
      - "tests/desktop/**"
      - ".github/workflows/desktop-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  INTERFACES_REV: bd1c7cb0b014c94fba75ea61b8cc9c0c36b03362
  RUST_DESKTOP_REV: 708d466b32153a301e3fec399002f46c6a62abb9
  FLUTTER_EVIDENCE_REV: 4af7072c502a82e2c2ef15234188e6942fed502d

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out E2E harness without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Check out immutable interface contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: file-tunnel/ftnl-interfaces
          ref: ${{ env.INTERFACES_REV }}
          path: vendor/ftnl-interfaces
          persist-credentials: false
          show-progress: false
      - name: Check out immutable Rust desktop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: file-tunnel/ftnl-desktop-app.rs
          ref: ${{ env.RUST_DESKTOP_REV }}
          path: vendor/ftnl-desktop-app
          persist-credentials: false
          show-progress: false
      - name: Check out immutable sanitized Flutter evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: file-tunnel-test/contract-conformance-tests
          ref: ${{ env.FLUTTER_EVIDENCE_REV }}
          path: vendor/desktop-evidence
          persist-credentials: false
          show-progress: false
      - name: Use Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - name: Validate cross-client contract and Bluetooth boundaries
        env:
          FTNL_INTERFACES_DIR: ${{ github.workspace }}/vendor/ftnl-interfaces
          FTNL_RUST_DESKTOP_DIR: ${{ github.workspace }}/vendor/ftnl-desktop-app
          FTNL_DESKTOP_EVIDENCE_DIR: ${{ github.workspace }}/vendor/desktop-evidence
          FTNL_VERIFY_DESKTOP_REVISIONS: "1"
        run: node --test tests/desktop/desktop-parity.e2e.test.mjs
      - name: Execute the Rust desktop headless reducer suite
        run: cargo test --locked --manifest-path vendor/ftnl-desktop-app/Cargo.toml --no-default-features --lib
      - name: Verify immutable dependency state
        run: git -C vendor/ftnl-desktop-app diff --exit-code -- Cargo.lock
