name: AttoLang reference model (abstract only)
on:
  pull_request:
    paths:
      - 'formal/attolang/**'
      - '.github/workflows/attolang-reference-model.yml'
  push:
    paths:
      - 'formal/attolang/**'
      - '.github/workflows/attolang-reference-model.yml'
  workflow_dispatch:
jobs:
  finite-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact triggering head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin Node.js setup action
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify exact-head abstract model and negative mutation
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node formal/attolang/model_check.mjs
          echo "ATTO_MODEL_ONLY_HEAD=$EXPECTED_HEAD"
          echo 'ATTO_COMPILED_GUEST=NOT_EXECUTED'
