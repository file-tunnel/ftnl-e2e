name: Deep logging chain contract

on:
  pull_request:
    paths:
      - '.github/workflows/logging-chain-deep-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commonjs-transfer-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_LOGGERS_SHA: 5a2596ccb662baca6c1b27327683072da0803b31
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch exact next-loggers source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/ORESoftware/next-loggers.ts.git
          git -C source fetch --no-tags --depth=1 origin "$NEXT_LOGGERS_SHA"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$NEXT_LOGGERS_SHA"
          git -C source checkout --detach "$NEXT_LOGGERS_SHA"
      - name: Build lint surface without lifecycle scripts
        working-directory: source
        run: npm ci --ignore-scripts && npx tsc -p tsconfig.build.json
      - name: Exercise CommonJS aliases and suppression boundary
        working-directory: source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Linter } from 'eslint';
          import eslintPlugin from './dist/eslint-plugin.js';

          const code = `
            const logging = require('@oresoftware/next-loggers');
            const { createLogger: makeLogger } = require('@oresoftware/next-loggers');
            const transferLog = makeLogger();
            const routineId = 'ores-routine-FileTunnel_123456';
            logging.logger.info('pairing accepted')
              .addTraceId('ores-trace-FileTunnel_123456')
              .addRoutineId(routineId)
              .send();
            // eslint-disable-next-line next-loggers/require-observability-chain -- external driver owns terminal delivery
            transferLog.warn('delegated browser-driver message');
            transferLog.error('missing routine')
              .addTraceId('ores-trace-FileTunnelErr_123')
              .send();
          `;
          const linter = new Linter();
          const messages = linter.verify(code, [{
            languageOptions: { ecmaVersion: 'latest', sourceType: 'commonjs' },
            plugins: { 'next-loggers': eslintPlugin },
            rules: { 'next-loggers/require-observability-chain': 'error' },
          }], { filename: 'transfer.cjs' });
          assert.equal(messages.length, 1, JSON.stringify(messages));
          assert.match(messages[0].message, /routineId/);
          NODE
